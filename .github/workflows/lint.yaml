name: Python Quality Control

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Installs the app's requirements plus pytest, Black, and flake8
          pip install -r requirements-dev.txt

      - name: Check formatting with Black
        # This will check if your code follows the Black style guide
        run: black . --check

      - name: Lint with flake8
        run: |
          # Basic syntax error check
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Detailed linting (exit-zero ensures the build doesn't fail
          # just because of a missing space, but still reports it)
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Run tests
        # Offline tests with synthetic Statcast rows; no network access needed
        run: python -m pytest -q
